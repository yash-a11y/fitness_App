apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.sevenminuteworkout"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Set to 17 or lower
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17' // Align with Java version
    }

    buildFeatures {
        viewBinding true
    }

    namespace 'com.sevenminuteworkout'
}

dependencies {
    def room_version = '2.5.0' // Updated Room version
    def activityVersion = '1.6.1' // Updated Activity version

    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    implementation "androidx.activity:activity-ktx:$activityVersion"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1' // Updated AppCompat version
    implementation 'androidx.core:core-ktx:1.9.0' // Updated Core KTX version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Updated ConstraintLayout version
    implementation 'com.google.android.material:material:1.8.0' // Updated Material version

    testImplementation 'junit:junit:4.13.2' // Updated JUnit version
    androidTestImplementation 'androidx.test.ext:junit:1.1.5' // Updated AndroidX Test JUnit version
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1' // Updated Espresso version
}
